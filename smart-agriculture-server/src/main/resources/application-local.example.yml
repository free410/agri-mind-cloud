# 本地敏感配置示例（勿提交真实值）
#
# 使用方式（任选其一）：
# 1) 复制本文件为 application-local.yml（已在 .gitignore 中忽略），并启动时增加：
#    --spring.profiles.active=local,dev
#    或在 IDE 的 Active profiles 中填写：local
# 2) 或在本机设置环境变量：MYSQL_PASSWORD、JWT_SECRET_KEY、SMART_AGRI_NEO4J_PASSWORD 等
#
# application.yml 中对应项已改为优先读取环境变量，仓库内不含真实口令。

spring:
  datasource:
    username: root
    password: "请填写本地 MySQL 密码"

smart-agri:
  jwt:
    secret-key: "请填写至少 32 字符的随机串作为 JWT 密钥"
  knowledge-graph:
    neo4j-password: "请与 Neo4j 实例或 docker-compose 中密码一致"
